#
# Builds the GPU effects module (gpufx, see gpufx/README.md) for Kdenlive's
# Windows standalone build, tests it inside that build, and uploads it laid
# out like the standalone's folder: merging the artifact's
# kdenlive-<version>_standalone folder into an installed one adds the module.
#
# Run it from the Actions tab ("Run workflow"). It also runs when the module
# changes.

name: GPU effects module for Kdenlive on Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (it must contain the gpufx module)
        required: true
        default: claude/amazing-cannon-tea8xm
      kdenlive_version:
        description: Kdenlive release whose Windows standalone build the module is tested with and laid out for
        required: true
        default: '26.08.1'
  push:
    paths:
      - 'gpufx/**'
      - '.github/workflows/gpufx-windows.yml'
  pull_request:
    paths:
      - 'gpufx/**'
      - '.github/workflows/gpufx-windows.yml'

permissions:
  contents: read

env:
  KDENLIVE_VERSION: ${{ inputs.kdenlive_version || '26.08.1' }}
  # MLT headers to compile with. The module adapts to the version of the MLT
  # it is loaded into at runtime.
  MLT_HEADERS: v7.42.0

jobs:
  source:
    name: Find the module's source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      found: ${{ steps.find.outputs.found }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for pushes and pull requests: their own commit
          ref: ${{ inputs.ref }}
          sparse-checkout: gpufx/standalone
      - id: find
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f gpufx/standalone/CMakeLists.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$(git rev-parse --short HEAD) does not contain the gpufx module, there is nothing to build. Run the workflow with a branch that has it."
          fi

  windows:
    name: Build and test with Kdenlive ${{ inputs.kdenlive_version || '26.08.1' }}
    needs: source
    if: needs.source.outputs.found == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source

      - name: Get MLT's headers
        shell: bash
        run: git clone --quiet --depth 1 --branch "$MLT_HEADERS" https://github.com/mltframework/mlt.git mlt

      - name: Cache Kdenlive's download
        uses: actions/cache@v4
        with:
          path: download
          key: kdenlive-standalone-${{ env.KDENLIVE_VERSION }}

      - name: Get Kdenlive's standalone build
        shell: pwsh
        run: |
          $version = $env:KDENLIVE_VERSION
          $series = $version -replace '\.[^.]+$', ''
          $name = "kdenlive-${version}_standalone.exe"
          New-Item -ItemType Directory -Force download | Out-Null
          if (-not (Test-Path "download/$name")) {
            # Older releases move to the Attic
            foreach ($base in "https://download.kde.org/stable/kdenlive/$series/windows", "https://download.kde.org/Attic/kdenlive/$series/windows") {
              Write-Output "Downloading $base/$name"
              curl.exe --fail --location --retry 3 --connect-timeout 30 --silent --show-error --output "download/$name" "$base/$name"
              if ($LASTEXITCODE -eq 0) { break }
              Remove-Item "download/$name" -ErrorAction SilentlyContinue
            }
            if (-not (Test-Path "download/$name")) { throw "Cannot download $name from download.kde.org" }
          }
          7z x "download/$name" -okdenlive -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot extract $name" }
          $mlt = Get-ChildItem kdenlive -Recurse -Filter libmlt-7.dll | Select-Object -First 1
          if (-not $mlt) { throw "$name has no libmlt-7.dll" }
          $root = Split-Path (Split-Path $mlt.FullName)
          "KDENLIVE_ROOT=$root" >> $env:GITHUB_ENV
          Write-Output "Kdenlive's folder: $root"

      # Kdenlive's Windows builds use MinGW with the UCRT C runtime: so does
      # this toolchain, the module and MLT share memory
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build
        shell: msys2 {0}
        run: |
          root=$(cygpath -m "$KDENLIVE_ROOT")
          # Linked to Kdenlive's own libmlt-7.dll, so that a function it does
          # not have fails the build
          cmake -S source/gpufx/standalone -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMLT_INCLUDE_DIR="$(cygpath -m "$PWD/mlt/src")" -DMLT_LIBRARY="$root/bin/libmlt-7.dll"
          cmake --build build

      - name: Check the module's dependencies
        shell: msys2 {0}
        run: |
          deps=$(objdump -p build/gpufx/libmltgpufx.dll | awk '/DLL Name:/ {print $3}')
          echo "$deps"
          for dll in $deps; do
            case "${dll,,}" in
              kernel32.dll|api-ms-win-crt-*.dll|libmlt-7.dll) ;;
              *) echo "::error::libmltgpufx.dll needs $dll, which is not part of Windows or MLT"; exit 1 ;;
            esac
          done

      - name: Test inside Kdenlive's standalone build
        shell: bash
        run: |
          root=$(cygpath -u "$KDENLIVE_ROOT")
          # Installed as in Kdenlive's folder: MLT loads it from lib/mlt
          cp build/gpufx/libmltgpufx.dll "$root/lib/mlt/"
          # From bin, MLT finds its modules, data and frei0r plugins as it does for Kdenlive
          cp build/gpufx/tests/gpufx_test.exe "$root/bin/"
          export QT_QPA_PLATFORM=offscreen
          # The tests' emulated GPU, which runs the kernels on the CPU
          export GPUFX_CUDA_LIBRARY="$(cygpath -w "$PWD/build/gpufx/tests/libgpufx_mockcuda.dll")"
          "$root/bin/gpufx_test.exe" 2>&1 | tee test.log
          if grep '^SKIP' test.log; then
            echo "::error::Kdenlive's MLT lacks services that the tests need"
            exit 1
          fi
          MOCKCUDA_NO_DEVICE=1 "$root/bin/gpufx_test.exe" --no-gpu 2>&1 | tail -n 3

      - name: Package
        shell: msys2 {0}
        run: |
          folder="kdenlive-${KDENLIVE_VERSION}_standalone"
          cmake --install build --prefix "dist/$folder"
          cat > dist/README-gpufx.txt <<EOF
          GPU effects (gpufx) for Kdenlive ${KDENLIVE_VERSION} on Windows

          Built from ${{ github.repository }} commit ${{ needs.source.outputs.sha }}
          by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To install, drag the $folder folder into the folder that contains your
          Kdenlive folder and let Windows merge them. It adds one file,
          $folder\\lib\\mlt\\libmltgpufx.dll, which Kdenlive and its renderer load on
          their own. To uninstall, delete that file.

          It needs an NVIDIA GPU of the Maxwell generation or newer (GeForce GTX 750
          and later) and its driver.
          Without them, every effect runs on the CPU as before. To turn it off
          without uninstalling, set the environment variable MLT_GPUFX=0.

          See gpufx/README.md in the source for the effects it accelerates.
          EOF
          find dist -type f

      - uses: actions/upload-artifact@v4
        with:
          name: gpufx-kdenlive-${{ env.KDENLIVE_VERSION }}-windows
          path: dist/
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo "### GPU effects module for Kdenlive ${KDENLIVE_VERSION} on Windows"
            echo
            echo "Download the **gpufx-kdenlive-${KDENLIVE_VERSION}-windows** artifact below and unzip it."
            echo "Drag its \`kdenlive-${KDENLIVE_VERSION}_standalone\` folder into the folder that contains your Kdenlive folder and let Windows merge them:"
            echo "it adds \`lib\\mlt\\libmltgpufx.dll\`."
            echo
            echo "Tests run inside Kdenlive ${KDENLIVE_VERSION}'s own build, with an emulated GPU:"
            echo
            echo '```'
            tail -n 1 test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
